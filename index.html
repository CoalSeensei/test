<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>韩立的修仙历练簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-bg="tiannan">
  <div class="bg-layer">
    <div class="bg-mountains"></div>
    <div class="bg-particles" id="particles"></div>
    <div class="bg-vignette"></div>
  </div>

  <header class="header">
    <div class="header-left">
      <div class="avatar">韩</div>
      <div class="brand">
        <span class="brand-title">凡人修仙传</span>
        <span class="brand-sub">A Record of a Mortal's Journey</span>
      </div>
    </div>

    <div class="header-center">
      <h1 class="site-title">韩立的修仙历练簿</h1>
      <div class="title-brush"></div>
    </div>

    <div class="header-right top-actions" id="topActions">
      <button class="top-action-btn" data-panel="chance">⚡ 机缘触发</button>
      <button class="top-action-btn" data-panel="treasury">📚 修仙宝库</button>
      <button class="top-action-btn" data-panel="badge">🏅 徽章系统</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar simple-sidebar">
      <section class="sb-section">
        <h3 class="sb-heading"><span class="sb-deco">✦</span> 待办分类 <span class="sb-deco">✦</span></h3>
        <div class="filter-group" id="categoryFilters">
          <button class="grade-btn active" data-category="all">全部</button>
          <button class="grade-btn" data-category="todo">未完成</button>
          <button class="grade-btn" data-category="doing">进行中</button>
          <button class="grade-btn" data-category="done">已完成</button>
        </div>
      </section>

      <section class="sb-section">
        <h3 class="sb-heading"><span class="sb-deco">✦</span> 修仙境界筛选 <span class="sb-deco">✦</span></h3>
        <div class="realm-list" id="realmFilters">
          <button class="realm-item active" data-realm="all"><span class="realm-name">全部境界</span></button>
          <button class="realm-item" data-realm="fanren"><span class="realm-name">凡人</span></button>
          <button class="realm-item" data-realm="lianqi"><span class="realm-name">炼气</span></button>
          <button class="realm-item" data-realm="zhuji"><span class="realm-name">筑基</span></button>
          <button class="realm-item" data-realm="jindan"><span class="realm-name">金丹</span></button>
          <button class="realm-item" data-realm="yuanying"><span class="realm-name">元婴+</span></button>
        </div>
      </section>
    </aside>

    <main class="main">
      <section class="main-default" id="mainDefault">
        <div class="main-header">
          <h2 class="main-title">修炼日志</h2>
        </div>

        <div class="log-grid">
          <article class="log-card"><h4>今日番茄钟专注总时长</h4><p id="logTodayFocus">0 分钟</p></article>
          <article class="log-card"><h4>今日专注等级</h4><p id="logTodayLevel">炼气期专注</p></article>
          <article class="log-card"><h4>累计灵石数量</h4><p id="logTotalStones">0</p></article>
          <article class="log-card"><h4>今日完成待办数</h4><p id="logTodayDone">0</p></article>
        </div>

        <section class="history-card">
          <h3 class="main-title">历史专注数据概览（近 7 日）</h3>
          <div id="logHistory" class="log-history"></div>
        </section>

        <section class="task-section">
          <div class="task-section-head">
            <h3 class="main-title">历练任务</h3>
            <button class="add-btn" id="addTaskBtn">
              <span class="add-btn-icon">符</span>
              <span class="add-btn-text">新增历练任务</span>
            </button>
          </div>
          <div class="task-list" id="taskList"></div>
          <div class="empty-state" id="emptyState" hidden>
            <div class="empty-scroll">📜</div>
            <p class="empty-title">暂无历练任务</p>
            <p class="empty-hint">低调积累，步步为营</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="full-panel" id="fullPanel" hidden>
    <div class="full-panel-hd">
      <button class="full-panel-back" id="fullPanelBack">← 返回修炼</button>
      <h2 class="full-panel-title" id="fullPanelTitle"></h2>
    </div>
    <div class="full-panel-bd" id="fullPanelBody"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-hd">
        <h3 class="modal-title" id="modalTitle">新增历练任务</h3>
        <button class="modal-x" id="modalClose">✕</button>
      </div>
      <div class="modal-bd">
        <div class="field">
          <label class="field-label">历练内容</label>
          <input class="field-input" id="taskInput" type="text" placeholder="请输入修仙任务…" maxlength="100" autocomplete="off" />
        </div>
        <div class="field">
          <label class="field-label">绑定番茄钟</label>
          <select class="field-input" id="bindTypeSelect">
            <option value="none">不绑定</option>
            <option value="one">1 个番茄钟</option>
            <option value="custom">自定义时长</option>
          </select>
        </div>
        <div class="field" id="customMinutesWrap" hidden>
          <label class="field-label">自定义绑定时长（分钟）</label>
          <input class="field-input" id="customMinutesInput" type="number" min="10" max="600" value="50" />
        </div>
      </div>
      <div class="modal-ft">
        <button class="cancel-btn" id="modalCancel">取消</button>
        <button class="submit-btn" id="modalSubmit">保存任务</button>
      </div>
    </div>
  </div>

  <div class="task-menu" id="taskMenu" hidden>
    <button id="menuEditBtn">编辑任务</button>
    <button id="menuDeleteBtn">删除任务</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="floating-pomodoro" id="floatingPomodoro">
    <div class="pomodoro-title">🫙 闭关专注</div>
    <div class="pomodoro-phase" id="pomoPhase">专注修炼</div>
    <div class="pomodoro-timer" id="pomoTimer">00:00</div>
    <div class="pomodoro-cycle" id="pomoInfo">当前 0 / 剩余 0 分钟</div>
    <div class="pomodoro-config">
      <label for="floatingPomoMinutesInput">时长（10-60 分钟）</label>
      <div class="pomodoro-config-row">
        <input id="floatingPomoMinutesInput" class="field-input" type="number" min="10" max="60" value="25" />
        <button class="pomodoro-btn" id="floatingPomoApplyBtn">应用</button>
      </div>
    </div>
    <div class="pomodoro-actions">
      <button class="pomodoro-btn primary" id="pomoStartBtn">开始</button>
      <button class="pomodoro-btn" id="pomoResetBtn">重置</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
